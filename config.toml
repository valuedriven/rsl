# Configuração do pacote src/rsl (python3 -m rsl <subcomando>), lida sob demanda com tomllib
# (Python 3.11+). A variável de ambiente RSL_CONFIG aponta outro arquivo, para ensaio.
#
# Regra de precedência: o PROTOCOLO é a fonte. Todo parâmetro NÃO ESTRUTURAL tem aqui um
# valor padrão; quando o protocolo declara o parâmetro, vale o valor do protocolo. Trecho
# do protocolo presente e ilegível reprova a leitura — não cai no padrão. `python3 -m rsl
# mostrar` exibe o valor em uso e a origem de cada parâmetro.
#
# Parâmetros ESTRUTURAIS não têm padrão e não entram aqui: composição das expressões,
# instrumentos (sigla, modo, caminho, idiomas, facetas), bases (sigla, nome), conjunto-
# semente e idiomas do quadro vêm só do protocolo; a forma de execução de cada base vem da
# ficha. A FORMA exigida do protocolo e das fichas (seções, colunas, rótulos) é a gramática
# do leitor, exibida por `python3 -m rsl gramatica`, e também não entra aqui. As chaves
# antigas (`padroes.composicao`, `cores`, `fichas`, `instrumentos`, `idiomas`,
# `expressoes.colunas`) e qualquer chave fora do esquema reprovam a configuração.
#
# Este arquivo é editado pelo pesquisador; nenhum subcomando o grava.

# Documento do protocolo a ser lido. Único parâmetro que o protocolo não sobrescreve:
# é ele que localiza o protocolo. Caminho relativo à raiz do projeto.
protocolo = "docs/03_protocolo_estrategia_pesquisa.md"

# ------------------------------------------------------------------ padrões sobrescritos
# Valores usados só quando o protocolo não declara o parâmetro.
[padroes]
# CE de "Intervalo temporal" com ação Incluir ("após o ano AAAA").
recorte_ano_min = 2017
# Regra de ajuste do conjunto-semente ("recuperação inferior a N% das sementes de
# validação").
limiar_aderencia = 0.80
# Faixa da fração elegível de sonda \ executada (EB5: "< N%" e "> M%").
sensibilidade = [0.05, 0.15]
# Facetas marcadas "âncora obrigatória" nas palavras significativas.
ancoras = ["FCT1", "FCT2"]
# Expressão executada e sonda de sensibilidade (coluna Natureza, ver [expressoes]).
executada = "EB4"
sonda = "EB5"
# Divergência simétrica máxima no teste de fidelidade da derivação: acima dela a derivação
# local é reprovada (o protocolo não a declara hoje).
divergencia_fidelidade = 0.10
# Sensibilidade mínima da triagem assistida (ASReview), aferida em conjunto disjunto do de
# ajuste; abaixo dela a triagem permanece integralmente humana (o protocolo não a declara).
calibracao_triagem = 0.95

# ------------------------------------------------------- parâmetros só desta configuração
[expressoes]
# Texto da coluna Natureza que identifica o papel da expressão no protocolo.
natureza_executada = "Cobertura restrita"
natureza_sonda = "Controle de sensibilidade"

[conferencia]
# Mínimo de termos distintos por string de faceta.
minimo_termos_string = 20
# Dimensões que a tabela de critérios de elegibilidade tem de declarar, com a grafia do
# protocolo (coluna Dimensão).
dimensoes_criterio = [
    "Intervalo temporal", "Idioma", "Tipo documental", "Localização de itens",
    "Adequação temática", "Domínio de aplicação", "Outros critérios",
]
# Dimensão (coluna Dimensão) cujo critério Incluir declara o recorte temporal ("após o ano
# AAAA").
dimensao_recorte = "Intervalo temporal"

[busca]
# Ordem de leitura da 1ª filtragem (Medida 4): registro publicado neste ano ou depois conta
# como recente, depois da riqueza das expressões atingidas. Ordem de leitura, não critério.
ano_recencia = 2022
# Tamanho-alvo da amostra sistemática da sonda de sensibilidade: um a cada
# max(1, perdidos // N) registros perdidos pela executada vai à classificação manual.
amostra_sensibilidade = 50

[dados]
# Arquivos alimentados e pastas de entrada. Caminhos relativos à raiz do projeto.
sementes = "data/sementes.json"
registro = "data/registro_execucao.json"
validacao = "data/validacao_terminologica.csv"
# Exportações brutas de cada execução, por base.
execucoes = "data/execucoes"
# Respostas brutas das consultas aos instrumentos de controle terminológico.
evidencia = "data/evidencia"

[saidas]
# Arquivos derivados, regeráveis, gravados em `pasta`. Nomes em snake_case, em português,
# sem acento; arquivo por chave leva a chave em minúsculas ({expressao}, {base}).
pasta = "data"
registros = "registros.csv"
contagens = "contagens_busca.csv"
ordem_triagem = "ordem_triagem.csv"
fidelidade = "fidelidade_{expressao}.csv"
sensibilidade = "sensibilidade_{base}.csv"
aderencia = "semente_aderencia.csv"

[documentos]
# Ficha de busca de cada base, localizada pela sigla da tabela "Bases de dados" do
# protocolo; tem de conter {sigla}. Caminho relativo à raiz do projeto.
ficha = "docs/busca_base_{sigla}.md"

# ----------------------------------------------------------------- planilhas e JSON
[planilha]
# Colunas da planilha de validação, na ordem em que é escrita.
campos_validacao = [
    "instrumento", "consultado_em", "versao_instrumento", "url_consultada",
    "status_proposto", "rotulo_autorizado", "uri_conceito",
    "equivalentes_USE_UP", "termos_genericos_TG", "termos_especificos_TE",
    "termos_relacionados_TR", "nota_de_escopo",
    "arquivo_evidencia", "observacao_tecnica",
    "decisao_ReT", "justificativa_ReT", "data_decisao",
]
# Metadados de cada semente em sementes.json que a sincronização nunca sobrescreve.
campos_autorais = ["verificacao", "escopo", "tipo", "alinhamento", "nota",
                   "veiculo_conferido", "eric"]
