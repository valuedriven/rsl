# Configuração do pacote src/rsl (python3 -m rsl <subcomando>), lida sob demanda com tomllib
# (Python 3.11+). A variável de ambiente RSL_CONFIG aponta outro arquivo, para ensaio.
#
# Regra de precedência: o PROTOCOLO é a fonte. Todo parâmetro NÃO ESTRUTURAL tem aqui um
# valor padrão; quando o protocolo declara o parâmetro, vale o valor do protocolo. Trecho
# do protocolo presente e ilegível reprova a leitura — não cai no padrão. `python3 -m rsl
# mostrar` exibe o valor em uso e a origem de cada parâmetro.
#
# Parâmetros ESTRUTURAIS não têm padrão e não entram aqui: composição das expressões (de
# onde se identificam a executada e a sonda), facetas e âncoras, instrumentos (sigla, modo,
# caminho, idiomas, facetas), bases (sigla, nome) e idiomas do quadro vêm só do protocolo;
# o conjunto-semente vem só do arquivo de sementes (`[documentos] sementes`); a forma de
# execução de cada base vem da fonte do procedimento de busca. A FORMA exigida do
# protocolo, da fonte dos procedimentos de busca, do arquivo de sementes e do arquivo de
# exceções de flexão (seções, colunas, rótulos, tabelas, campos) é a gramática do leitor,
# exibida por `python3 -m rsl documentos gramatica`, e também não entra aqui. As chaves antigas
# (`padroes.composicao`, `padroes.ancoras`, `padroes.executada`, `padroes.sonda`, `cores`,
# `fichas`, `instrumentos`, `idiomas`, `[expressoes]`) e qualquer chave fora do esquema
# reprovam a configuração.
#
# Este arquivo é editado pelo pesquisador; nenhum subcomando o grava.

# Documento do protocolo a ser lido. O protocolo não sobrescreve este parâmetro: é ele que
# localiza o protocolo. Caminho relativo à raiz do projeto.
protocolo = "docs/03_protocolo_estrategia_pesquisa.md"

# ------------------------------------------------------------------ padrões sobrescritos
# Valores usados só quando o protocolo não declara o parâmetro.
[padroes]
# CE de "Intervalo temporal" com ação Incluir ("após o ano AAAA").
recorte_ano_min = 2017
# Regra de ajuste do conjunto-semente ("recuperação inferior a N% das sementes de
# validação").
limiar_aderencia = 0.80
# Faixa da fração elegível de sonda \ executada ("< N%" e "> M%" nas notas citadas pela
# executada).
sensibilidade = [0.05, 0.15]
# Divergência simétrica máxima no teste de fidelidade da derivação: acima dela a derivação
# local é reprovada (o protocolo não a declara hoje).
divergencia_fidelidade = 0.10

# ------------------------------------------------------- parâmetros só desta configuração
[conferencia]
# Dimensões que a tabela de critérios de elegibilidade tem de declarar, com a grafia do
# protocolo (coluna Dimensão).
dimensoes_criterio = [
    "Intervalo temporal", "Idioma", "Tipo documental", "Adequação temática",
    "Domínio de aplicação", "Outros critérios",
]
# Dimensão (coluna Dimensão) cujo critério Incluir declara o recorte temporal ("após o ano
# AAAA").
dimensao_recorte = "Intervalo temporal"

[busca]
# Ordem de leitura da 1ª filtragem (Medida 4): registro publicado neste ano ou depois conta
# como recente, depois da riqueza das expressões atingidas. Ordem de leitura, não critério.
ano_recencia = 2022
# Tamanho-alvo da amostra sistemática da sonda de sensibilidade: um a cada
# max(1, perdidos // N) registros perdidos pela executada vai à classificação manual.
amostra_sensibilidade = 50

[dados]
# Arquivos alimentados e pastas de entrada. Caminhos relativos à raiz do projeto.
registro = "data/registro_execucao.json"
# Arquivo de decisões do ReT sobre o controle terminológico (TOML, editado pelo pesquisador:
# só os campos decisao_ReT, justificativa_ReT e data_decisao). A chave de cada tabela é a
# faceta, o idioma, o termo e o instrumento.
validacao = "data/validacao_terminologica.toml"
# Resultado técnico das consultas aos instrumentos (JSON, escrito só pelo script e não
# editado à mão): uma linha por chave consultada, com a resposta e a evidência.
consulta_terminologica = "data/consulta_terminologica.json"
# Pasta dos temporários: o que se obtém do Zotero para leitura local e as saídas
# regeneráveis. Fica fora do controle de versão: tem de estar listada no .gitignore da raiz,
# ou a configuração reprova. Nada temporário se grava em data/.
temporarios = "tmp"
# Cache das exportações de cada execução, por base (<execucoes>/<sigla>/<identificador>.ris),
# obtidas da coleção da execução no Zotero. Tem de ficar dentro de `temporarios`, ou a
# configuração reprova. A execução registrada só com `arquivo` continua lida desse caminho.
execucoes = "tmp/execucoes"
# Respostas brutas das consultas aos instrumentos de controle terminológico.
evidencia = "data/evidencia"
# Cópia da coleção de sementes do Zotero (resposta bruta, lida pela via de [zotero] acesso,
# com biblioteca, coleção, versão, via e data e hora da leitura). Gravada só por
# `sementes copiar` (e regravada por `sementes completar --gravar`); os demais subcomandos a
# leem, sem acessar o Zotero.
zotero = "data/zotero_sementes.json"

[saidas]
# Arquivos derivados, regeráveis, gravados em `pasta`. Nomes em snake_case, em português,
# sem acento; arquivo por chave leva a chave em minúsculas ({expressao}, {base}).
pasta = "data"
registros = "registros.csv"
contagens = "contagens_busca.csv"
ordem_triagem = "ordem_triagem.csv"
fidelidade = "fidelidade_{base}_{expressao}.csv"
sensibilidade = "sensibilidade_{base}.csv"
anatomia = "anatomia_{base}.csv"
anatomia_consultas = "anatomia_consultas_{base}.csv"
candidatos = "candidatos_{base}.csv"

[documentos]
# Procedimento de busca de cada base, localizado pela sigla da tabela "Bases de dados" do
# protocolo; tem de conter {sigla}. Caminho relativo à raiz do projeto. É SAÍDA de
# `python3 -m rsl procedimentos gerar <sigla> --gravar`: não se edita.
procedimento = "docs/procedimentos_busca_{sigla}.md"
# Fonte do procedimento de busca de cada base: pasta com `procedimento.toml` e os
# fragmentos de prosa; tem de conter {sigla}. É o que se edita. Esquema em
# `python3 -m rsl documentos gramatica`.
procedimento_fonte = "docs/procedimentos/{sigla}"
# Exceções de flexão de número (irregular, não contável, vetada), por termo e idioma, cada
# uma com a origem que a sustenta.
flexoes = "docs/flexoes.toml"
# Arquivo do conjunto-semente (TOML, uma tabela [[sementes]] por estudo, com o controle e o
# juízo do pesquisador: DOI, referência curta, bases, alinhamento das facetas, verificação e
# nota), editado pelo pesquisador. Os dados bibliográficos, o resumo e as palavras-chave
# ficam no Zotero ([zotero]) e chegam pela cópia ([dados] zotero), ligados pelo DOI. Esquema
# em `python3 -m rsl documentos gramatica`.
sementes = "docs/conjunto_semente.toml"

[zotero]
# Biblioteca e coleção do Zotero que guardam os dados das sementes (autoria, ano, título,
# veículo, volume, número, páginas, resumo e palavras-chave), ligadas ao arquivo de sementes
# pelo DOI. A chave da API web NÃO fica aqui: vem da variável de ambiente ZOTERO_API_KEY ou,
# na falta dela, da linha ZOTERO_API_KEY= do .env da raiz (que tem de estar no .gitignore);
# é emitida pelo pesquisador e nunca se grava em arquivo versionado nem se imprime.
biblioteca = "groups/5969244"
colecao = "V2C73IKE"
# Via de acesso ao Zotero, para ler e para escrever: "local" (o Zotero aberto na máquina do
# pesquisador, com o acesso local habilitado nas preferências; sem chave) ou "web" (a API
# web, com a chave acima). Nenhum subcomando troca de via sozinho.
acesso = "local"
# Biblioteca e coleção das buscas, que guardam os registros recuperados nas bases: uma
# subcoleção por base, nomeada pela sigla; dentro dela, uma coleção por execução, com o
# identificador da execução no início do nome. `library` vale na forma groups/<id> ou pelo
# endereço da biblioteca de grupo no site; sem ela, as buscas ficam na de `biblioteca`.
# `search_collection` é o NOME da coleção, localizada na raiz da biblioteca: duas coleções
# com esse nome na raiz reprovam. Sem padrão: entram aqui depois de o pesquisador criar a
# coleção no Zotero.
library="groups/6781444"
search_collection="buscas"
