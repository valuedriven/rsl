# Fonte do procedimento de busca da BRAPCI (BD4). O procedimento
# `docs/procedimentos_busca_brapci.md` é gerado daqui por
# `python3 -m rsl procedimentos gerar brapci --gravar`. Esquema: `python3 -m rsl documentos gramatica`.
#
# Migração de 2026-11-23 (change `geracao-das-fichas-de-busca`): transcrição do procedimento
# anterior; elementos novos das categorias mínimas entram como `nao_verificado`.

ressalvas = [
  "Alterar as consultas exige repetir as sondagens pertinentes da seção 1.",
  "Todos os termos são **termos livres**; não apresentá-los como descritores autorizados.",
  "No relato, declarar que o corpus desta base é a EB4, com o custo da âncora 🟨 medido pela sonda EB5 e pela varredura da faceta 🟦 isolada.",
]

