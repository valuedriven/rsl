# ------------------------------------------------------------------ roteiro de sondagens
# Comum a todas: na busca de `eric.ed.gov`, no navegador do pesquisador; uma consulta por
# vez; sem filtro de data e sem `Peer reviewed only`, salvo quando a sondagem pedir.

[[sondagens]]
id = "SD1"
elementos = ["Prefixo de campo restringe de fato"]
objetivo = "saber se `title:` restringe a busca ao título, em vez de ser ignorado"
pre_requisitos = ["busca de `eric.ed.gov` aberta no navegador do pesquisador, sem filtro de data e sem `Peer reviewed only`"]
passos = ["submeter o controle e anotar o retorno exibido", "submeter o teste e anotar o retorno exibido", "abrir três registros do teste e conferir se `ontology` está no título"]
observar = ["retorno exibido de cada consulta", "presença do termo no título dos registros abertos"]
evidencia = ["captura da tela de cada consulta, com a consulta e o retorno visíveis"]

[[sondagens.consultas]]
papel = "controle"
texto = "ontology"
onde = "caixa de busca"

[[sondagens.consultas]]
papel = "teste"
texto = "title:ontology"
onde = "caixa de busca"
muda = "o prefixo `title:`"

[[sondagens.leituras]]
resultado = "0 < teste < controle, e os três registros abertos têm `ontology` no título"
conclusao = "o prefixo de campo restringe ao título"
estado = "medicao"

[[sondagens.leituras]]
resultado = "teste = controle, teste = 0, ou registro aberto sem o termo no título"
conclusao = "não se distingue se o prefixo restringe; levar ao pesquisador"
estado = "nao_verificado"

[[sondagens]]
id = "SD2"
elementos = ["Parênteses para agrupamento"]
objetivo = "saber se um grupo entre parênteses com `OR` é aceito e alarga o retorno"
pre_requisitos = ["SD1 registrada com o prefixo de campo verificado"]
depende_de = ["SD1"]
passos = ["submeter o controle e anotar o retorno", "submeter o teste e anotar o retorno"]
observar = ["retorno exibido", "mensagem de erro, se houver"]
evidencia = ["captura da tela de cada consulta, com a consulta e o retorno visíveis"]

[[sondagens.consultas]]
papel = "controle"
texto = "title:ontology AND abstract:education"
onde = "caixa de busca"

[[sondagens.consultas]]
papel = "teste"
texto = "(title:ontology OR title:ontologies) AND abstract:education"
onde = "caixa de busca"
muda = "o grupo entre parênteses com `OR`"

[[sondagens.leituras]]
resultado = "teste ≥ controle > 0"
conclusao = "os parênteses agrupam"
estado = "medicao"

[[sondagens.leituras]]
resultado = "teste = 0 sem mensagem, teste < controle, ou mensagem de erro"
conclusao = "o agrupamento não se confirma; levar ao pesquisador"
estado = "nao_verificado"

[[sondagens]]
id = "SD3"
elementos = ["Exigência de condição externa ao grupo"]
objetivo = "saber se um grupo com `OR` sem condição fora dele devolve zero"
pre_requisitos = ["SD2 registrada com os parênteses verificados"]
depende_de = ["SD2"]
passos = ["submeter o controle e anotar o retorno", "submeter o teste e anotar o retorno e a mensagem exibida"]
observar = ["retorno exibido", "mensagem de erro ou de aviso, se houver"]
evidencia = ["captura da tela de cada consulta, com a consulta, o retorno e a mensagem visíveis"]

[[sondagens.consultas]]
papel = "controle"
texto = "(title:ontology OR title:ontologies) AND abstract:education"
onde = "caixa de busca"

[[sondagens.consultas]]
papel = "teste"
texto = "(title:ontology OR title:ontologies)"
onde = "caixa de busca"
muda = "sem condição fora do grupo"

[[sondagens.leituras]]
resultado = "controle > 0 e teste = 0 sem mensagem"
conclusao = "o grupo com `OR` precisa de condição fora dele"
estado = "medicao"

[[sondagens.leituras]]
resultado = "teste > 0, ou mensagem de erro"
conclusao = "a regra não se confirma; levar ao pesquisador antes de mudar a composição"
estado = "nao_verificado"

[[sondagens]]
id = "SD4"
elementos = ["a condição externa pode ser de campo, de texto livre ou outro grupo, antes ou depois"]
