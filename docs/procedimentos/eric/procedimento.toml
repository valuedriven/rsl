# ------------------------------------------------------------------ §2 critérios
[[criterios]]
ids = ["CE1", "CE2"]
rotulo = "Intervalo temporal — 2017 até a data de execução"
destino = "interface"
como = "filtro de data da página de resultados, 2017 a 2026; registrar o rótulo do filtro e o retorno antes e depois"

[[criterios]]
ids = ["CE3"]
rotulo = "Idiomas — português, inglês e espanhol"
destino = "nao"
como = "termos só em inglês; campo `language` não usado"

[[criterios]]
ids = ["CE4", "CE5"]
rotulo = "Tipo documental e revisão por pares"
destino = "nao"
como = "`Peer reviewed only` desmarcada; campo `publicationtype` não usado"

[[criterios]]
ids = ["CE6"]
rotulo = "Adequação temática — regra de inclusão"
destino = "aproximado"
como = "EB4 exige termo de prática (STR3) ou de fator situacional (STR4); a formalização se decide na triagem"

[[criterios]]
ids = ["CE6"]
rotulo = "Adequação temática — não pertinência e contra-escopo"
destino = "nao"
como = "exclusões temáticas manifestas na 2ª filtragem; aplicação integral na 3ª, com justificativa por ID"

[[criterios]]
ids = ["CE7", "CE8"]
rotulo = "Domínio de aplicação educacional"
destino = "ancora"
como = "faceta 🟨 (FCT2) como grupo de quatro palavras-raiz, em forma radical"

[[criterios]]
ids = ["CE9"]
rotulo = "Outros tipos documentais"
destino = "nao"
como = "2ª filtragem"

