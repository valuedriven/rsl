# Fonte do procedimento de busca da ERIC (BD3). O procedimento
# `docs/procedimentos_busca_eric.md` é gerado daqui por
# `python3 -m rsl procedimentos gerar eric --gravar`. Esquema: `python3 -m rsl documentos gramatica`.
#
# Migração de 2026-11-23 (change `geracao-das-fichas-de-busca`): todo elemento e toda regra
# de montagem dados como medidos entram como `nao_verificado`, com sondagem no roteiro; as
# sondagens da ERIC serão refeitas pelo pesquisador (decisão de 2026-11-23), e nenhum
# resultado antigo se reconstrói.

ressalvas = [
  "Todos os termos são **termos livres**; não apresentar as expressões como compostas de descritores ERIC.",
  "Alterar as expressões exige repetir as sondagens pertinentes da seção 1.",
  "No relato, declarar a assimetria de campo em relação à Scopus: aqui a faceta 🟦 vai ao título, e as palavras-chave correspondem ao campo controlado `descriptor`.",
]

