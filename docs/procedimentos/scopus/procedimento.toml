# Fonte do procedimento de busca da Scopus (BD2). O procedimento
# `docs/procedimentos_busca_scopus.md` é gerado daqui por
# `python3 -m rsl procedimentos gerar scopus --gravar`. Esquema: `python3 -m rsl documentos gramatica`.
#
# Migração de 2026-11-23 (change `geracao-das-fichas-de-busca`): transcrição do procedimento
# anterior; elementos novos das categorias mínimas entram como `nao_verificado`.

ressalvas = [
  "Todos os termos são **termos livres**; não apresentá-los como descritores autorizados.",
]

# ------------------------------------------------------------------ §1 sintaxe
[[sintaxe]]
elemento = "`TITLE-ABS-KEY()`"
categoria = "campos"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`PUBYEAR >`, `<`, `=`"
categoria = "filtros"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`LANGUAGE()`"
categoria = "filtros"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`DOCTYPE()` com os códigos `ar`, `re`, `cp`, `ch`, `bk`, `ed`, `le`, `no`, `sh`"
categoria = "filtros"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`SRCTYPE()` com `j`, `b`, `k`, `p`, `r`, `d`"
categoria = "filtros"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`OPENACCESS(0` ou `1)`"
categoria = "filtros"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`AND`, `OR`, `AND NOT`; precedência `OR` → `AND` → `AND NOT`"
categoria = "operadores"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"
nota = "a precedência muda em 2026"

[[sintaxe]]
elemento = "Truncamento `*` e `?`, mínimo de 3 caracteres antes do curinga"
categoria = "truncamento"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "Proximidade `W/n` e `PRE/n`"
categoria = "proximidade"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"
nota = "`W/5` **não medido**"

[[sintaxe]]
elemento = "`W/5` entre os grupos inteiros das duas âncoras"
categoria = "proximidade"
situacao = "nao_verificado"
sondagem = "SD2"
nota = "recusa leva à variante \"Redução por recusa da interface\""

[[sintaxe]]
elemento = "`{}` frase exata *versus* `\"\"` frase aproximada"
categoria = "frase"
situacao = "oficial"
fonte = "Elsevier, *Scopus Search API — search tips*"

[[sintaxe]]
elemento = "`\"\"` aproximada já inclui plurais e admite truncamento dentro dela; `{}` exata não admite truncamento"
categoria = "frase"
situacao = "nao_verificado"
sondagem = "SD3"
nota = "afirmado sem fonte na skill `auditoria-das-strings` até 2026-11-23; conferir também na documentação oficial"

[[sintaxe]]
elemento = "Limite de operadores por consulta"
categoria = "limite_consulta"
situacao = "nao_verificado"
sondagem = "SD4"
nota = "não documentado"

[[sintaxe]]
elemento = "Comprimento máximo da consulta"
categoria = "limite_consulta"
situacao = "nao_verificado"
sondagem = "SD4"
nota = "a maior consulta executável é medida por `python3 -m rsl documentos conferir`, no relato do teto de caracteres"

[[sintaxe]]
elemento = "Lematização do plural"
categoria = "lematizacao"
situacao = "nao_verificado"
sondagem = "SD3"

[[sintaxe]]
elemento = "Tratamento de diacríticos"
categoria = "idioma_indexacao"
situacao = "nao_verificado"
sondagem = "SD5"
nota = "as strings trazem as duas grafias"

[[sintaxe]]
elemento = "Teto de retorno exibido"
categoria = "limite_retorno"
situacao = "nao_verificado"
sondagem = "SD6"
nota = "conferir na interface antes de exportar"

[[sintaxe]]
elemento = "Teto de exportação por lote"
categoria = "limite_exportacao"
situacao = "nao_verificado"
sondagem = "SD7"
nota = "conferir na interface antes de exportar"

[[sintaxe]]
elemento = "Parênteses para agrupamento"
categoria = "agrupamento"
situacao = "nao_verificado"
sondagem = "SD1"

[[sintaxe]]
elemento = "Vocabulário controlado de assunto"
categoria = "vocabulario_controlado"
