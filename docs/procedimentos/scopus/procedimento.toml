situacao = "oficial"
fonte = "Elsevier, *How can I best use the Advanced search?* (Scopus Support Center)"
nota = "código `DOI` na tabela de códigos de campo da busca avançada: `DOI(10.1007/s00202-004-0261-3)` devolve o documento com esse DOI (https://www.elsevier.support/scopus/answer/how-can-i-best-use-the-advanced-search, atualizada em 2026-08-24, consultada em 2026-11-26); é a forma da restrição por DOI do diagnóstico da perda. O agrupamento de vários `DOI()` por `OR` não está medido"

[[sintaxe]]
