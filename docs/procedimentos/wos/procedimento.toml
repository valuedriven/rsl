[[sondagens.leituras]]
resultado = "o último registro acessível tem posição menor que o retorno, ou há aviso de limite"
conclusao = "há teto de retorno exibido, na posição anotada"
estado = "medicao"

[[sondagens.leituras]]
resultado = "a navegação não chega à última página"
conclusao = "não se distingue o teto; levar ao pesquisador"
estado = "nao_verificado"

[[sondagens]]
id = "SD8"
elementos = ["Teto de exportação por lote", "Exportação em RIS com todos os campos"]
objetivo = "saber quantos registros a base exporta de uma vez em RIS com todos os campos"
pre_requisitos = ["busca avançada da Web of Science Core Collection aberta no navegador do pesquisador"]
passos = ["submeter a consulta e anotar o retorno", "abrir a exportação em RIS com todos os campos e anotar o número máximo de registros por lote que ela aceita", "exportar um lote e contar os registros do arquivo"]
observar = ["número máximo por lote oferecido pela exportação", "número de registros no arquivo", "campos presentes no arquivo (resumo, palavras-chave)"]
evidencia = ["captura da tela da opção de exportação", "o arquivo exportado"]

[[sondagens.consultas]]
