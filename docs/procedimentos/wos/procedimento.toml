# Fonte do procedimento de busca da Web of Science (BD1). O procedimento
# `docs/procedimentos_busca_wos.md` é gerado daqui por
# `python3 -m rsl procedimentos gerar wos --gravar`. Esquema: `python3 -m rsl documentos gramatica`.
#
# Migração de 2026-11-23 (change `geracao-das-fichas-de-busca`): transcrição do procedimento
# anterior; elementos novos das categorias mínimas entram como `nao_verificado`.

ressalvas = [
  "Todos os termos são **termos livres**; não apresentá-los como descritores autorizados.",
  "**`LA=`**: executar a sondagem mínima (`TS=ontology AND LA=Portuguese`) antes de usar; se recusada, usar o refinamento por idioma.",
  "**Texto completo** não é filtro de busca nesta base: o critério opera na 2ª filtragem.",
  "**Teses e dissertações** não são cobertas pela Core Collection: ficam a cargo da BRAPCI e, se necessário, da BDTD.",
]

# ------------------------------------------------------------------ §1 sintaxe
[[sintaxe]]
elemento = "`TS=` — tópico: título, resumo, palavras-chave de autor e *Keywords Plus*"
categoria = "campos"
situacao = "oficial"
fonte = "Clarivate, *Advanced Search Field Tags*"

[[sintaxe]]
elemento = "`TI=`, `AB=`, `AK=`, `SO=`, `KP=`, `WC=`, `SU=`, `DO=`, `ALL=`"
categoria = "campos"
situacao = "oficial"
fonte = "Clarivate, *Advanced Search Field Tags*"

[[sintaxe]]
elemento = "`PY=` — ano de publicação; exige combinação com outra *tag*"
categoria = "filtros"
situacao = "oficial"
fonte = "Clarivate, *Advanced Search Field Tags*"

[[sintaxe]]
elemento = "`DT=` — tipo de documento"
categoria = "filtros"
situacao = "oficial"
fonte = "Clarivate, *Advanced Search Field Tags*, e FECYT (2024)"

[[sintaxe]]
